<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="template.css">
  <title>Controle de LEDs</title>
</head>
<body>
  <h1>Controle de LEDs com Arduino via Web</h1>
  
  <div class="container">
    <h2>LED 1 (Verde)</h2>
    <button class="on" onclick="controlLed('1', 'on')">Ligar</button>
    <button class="off" onclick="controlLed('1', 'off')">Desligar</button>
  </div>

  <div class="container">
    <h2>LED 2 (Vermelho)</h2>
    <button class="on" onclick="controlLed('2', 'on')">Ligar</button>
    <button class="off" onclick="controlLed('2', 'off')">Desligar</button>
  </div>

    <div class="container">
    <h2>LED 3 (Amarelo)</h2>
    <button class="on" onclick="controlLed('3', 'on')">Ligar</button>
    <button class="off" onclick="controlLed('3', 'off')">Desligar</button>
  </div>


  <script>
    function controlLed(ledNum, action) {
      fetch(`/control/${ledNum}/${action}`) // Corrigido: era "fecht"
        .then(response => response.text())
        .then(data => {
          console.log(data);
          alert(data); // Mostra no navegador o que o servidor respondeu
        })
        .catch(error => {
          console.error('Erro:', error);
        });
    }
  </script>

  <style>
/* template.css - CSS SIMPLES E FUNCIONAL */
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
}

h1 {
    color: white;
    text-align: center;
    margin-bottom: 40px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.container {
    background: white;
    border-radius: 15px;
    padding: 25px;
    margin: 20px auto;
    max-width: 300px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

.container h2 {
    color: #333;
    margin-bottom: 20px;
    font-size: 1.4rem;
}

button {
    border: none;
    color: white;
    padding: 12px 24px;
    margin: 5px 10px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: bold;
    min-width: 100px;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

button:active {
    transform: translateY(0);
}

.on {
    background: linear-gradient(135deg, #28a745, #20c997);
}

.on:hover {
    background: linear-gradient(135deg, #218838, #1e9e85);
}

.off {
    background: linear-gradient(135deg, #dc3545, #fd7e14);
}

.off:hover {
    background: linear-gradient(135deg, #c82333, #e8590c);
}

/* Status de conexão */
.connection-status {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: bold;
    background: #d4edda;
    color: #155724;
    border: 2px solid #c3e6cb;
}

/* Responsivo */
@media (max-width: 768px) {
    body {
        padding: 10px;
    }
    
    .container {
        margin: 15px auto;
        padding: 20px;
    }
    
    button {
        padding: 10px 20px;
        font-size: 14px;
        min-width: 80px;
    }
}
  </style>
</body>
</html>
