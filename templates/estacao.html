<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle IoT</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0c0c0c, #1a1a2e, #16213e);
    color: #ffffff;
    min-height: 100vh;
    padding: 20px;
    line-height: 1.6;
}

.container {
    max-width: 500px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    position: relative;
    overflow: hidden;
}

.container::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: 0.5s;
}

.container:hover::before {
    left: 100%;
}

h1 {
    text-align: center;
    font-size: 2.2em;
    margin-bottom: 30px;
    background: linear-gradient(45deg, #00ff88, #00ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 30px rgba(0, 204, 255, 0.3);
    font-weight: 700;
}

.bloco {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
    position: relative;
}

.bloco:hover {
    transform: translateY(-5px);
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
}

.bloco h2 {
    color: #00ccff;
    border-bottom: 2px solid rgba(0, 204, 255, 0.3);
    padding-bottom: 10px;
    margin-bottom: 15px;
    font-size: 1.4em;
    display: flex;
    align-items: center;
    gap: 10px;
}

.bloco h2::before {
    content: '⚡';
    font-size: 1.2em;
}

.sensor-data {
    display: flex;
    justify-content: space-around;
    text-align: center;
    margin-top: 15px;
}

.data-item {
    flex: 1;
}

.data-label {
    font-size: 0.9em;
    color: #888;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.data-value {
    font-size: 2em;
    font-weight: bold;
    background: linear-gradient(45deg, #00ff88, #00ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.led-control {
    background: rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 15px;
    margin: 15px 0;
    border-left: 4px solid #00ff88;
}

.led-control:nth-child(even) {
    border-left-color: #00ccff;
}

.led-control:nth-child(3) {
    border-left-color: #ff6b6b;
}

.led-label {
    font-weight: 600;
    margin-bottom: 10px;
    color: #ddd;
    display: flex;
    align-items: center;
    gap: 8px;
}

.led-label::before {
    content: '💡';
    font-size: 1.1em;
}

button {
    font-size: 0.9em;
    padding: 12px 20px;
    margin: 5px;
    cursor: pointer;
    border-radius: 8px;
    border: none;
    color: white;
    font-weight: 600;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
}

button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
}

button:hover::before {
    left: 100%;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

button:active {
    transform: translateY(0);
}

.on {
    background: linear-gradient(135deg, #00b894, #00a085);
    box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
}

.on:hover {
    background: linear-gradient(135deg, #00a085, #008c75);
    box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4);
}

.off {
    background: linear-gradient(135deg, #ff6b6b, #ee5a52);
    box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
}

.off:hover {
    background: linear-gradient(135deg, #ee5a52, #d63031);
    box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.bloco {
    animation: fadeIn 0.6s ease-out;
}

.bloco:nth-child(2) {
    animation-delay: 0.2s;
}

.connection-status {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 10px 20px;
    border-radius: 25px;
    font-weight: 600;
    font-size: 0.8em;
    background: rgba(0, 255, 136, 0.1);
    color: #00ff88;
    border: 1px solid rgba(0, 255, 136, 0.3);
    backdrop-filter: blur(10px);
}

@media (max-width: 600px) {
    .container {
        margin: 10px;
        padding: 20px;
    }
    
    h1 {
        font-size: 1.8em;
    }
    
    .sensor-data {
        flex-direction: column;
        gap: 15px;
    }
    
    button {
        padding: 10px 15px;
        font-size: 0.8em;
    }
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle at 20% 80%, rgba(0, 255, 136, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 204, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 107, 107, 0.05) 0%, transparent 50%);
    z-index: -1;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Painel de Controle IoT</h1>

        <div class="bloco">
            <h2>Estação Meteorológica</h2>
            <p>Temperatura: <span id="temp">--</span> &deg;C</p>
            <p>Umidade: <span id="umid">--</span> %</p>
        </div>

        <div class="bloco">
            <h2>Controle dos LEDs</h2>
            <p>
                LED Verde (Pino 7):
                <button class="on" onclick="controlarLed(1, 'on')">Ligar</button>
                <button class="off" onclick="controlarLed(1, 'off')">Desligar</button>
            </p>
            <p>
                LED Vermelho (Pino 8):
                <button class="on" onclick="controlarLed(2, 'on')">Ligar</button>
                <button class="off" onclick="controlarLed(2, 'off')">Desligar</button>
            </p>
        </div>
    </div>

    <script>
        function controlarLed(ledNum, action) {
            fetch(`/controlar/${ledNum}/${action}`);
        }

        function buscarDadosSensor() {
            fetch('/get_data') // Chama a nova rota no app.py
                .then(response => response.json()) // Converte a resposta para JSON
                .then(data => {
                    if (data.error) {
                        document.getElementById('temp').innerText = "Erro";
                        document.getElementById('umid').innerText = "Erro";
                    } else {
                        document.getElementById('temp').innerText = data.temperatura;
                        document.getElementById('umid').innerText = data.umidade;
                    }
                })
                .catch(error => console.error('Erro ao buscar dados:', error));
        }

        setInterval(buscarDadosSensor, 3000);

        document.addEventListener('DOMContentLoaded', buscarDadosSensor);
    </script>
</body>
</html>
